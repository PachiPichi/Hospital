<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital</title>
    <!-- CSS de Bootstrap compilado y minificado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- JavaScript de Bootstrap (jQuery requerido) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="js/paciente.js"></script>
<script defer src="js/historiaClinica.js"></script>

</head>

<body>
    <div class="container">
        <div class="row mb-3">
            <div class="col-sm-6">
                <h2>CRUD pacientes</h2>
                <button id="botonNuevo" class="btn btn-success">Añadir</button>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <table id="tablaPacientes" class="table table-bordered table-condensed table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Fecha nacimiento</th>
                            <th>Teléfono</th>
                            <th>Acción</th>
                            <th>Acción</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="col-sm-4 ml-3" id="contenedorInfo"></div>
        </div>


        </div>
    </div>

    <!---------------VENTANAS MODALES --------------------->

    <!-- Modal para añadir paciente-->
    <div class="modal" id="nuevoPacienteModal" tabindex="-1" aria-labelledby="nuevoPacienteModalEtiqueta"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="nuevoPacienteModalEtiqueta">Añadir nuevo paciente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <!-- Formulario para añadir un nuevo paciente -->
                    <form id="nuevoPacienteForm">
                        <div class="mb-3">
                            <label for="nuevoPacienteNombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nuevoPacienteNombre" required>
                            <label for="nuevoPacienteFechaNac" class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="nuevoPacienteFechaNac" required>
                            <label for="nuevoPacienteTelefono" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="nuevoPacienteTelefono" required>
                            <label for="nuevoPacienteUsuario" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="nuevoPacienteUsuario" required>
                            <label for="nuevoPacienteClave" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="nuevoPacienteClave" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Añadir paciente</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para actualizar paciente-->
    <div class="modal" id="actualizarPacienteModal" tabindex="-1" aria-labelledby="actualizarPacienteModalEtiqueta"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="actualizarPacienteModalEtiqueta">Actualizar paciente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <!-- Formulario para actualizar paciente -->
                    <form id="actualizarPacienteForm">
                        <div class="mb-3">
                            <label for="actualizarPacienteId" class="form-label">Id del paciente</label>
                            <input type="text" class="form-control" id="actualizarPacienteId" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="actualizarPacienteNombre" class="form-label">Nombre del paciente</label>
                            <input type="text" class="form-control" id="actualizarPacienteNombre" required>
                            <label for="actualizarPacienteFechaNac" class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="actualizarPacienteFechaNac" required>
                            <label for="actualizarPacienteTelefono" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="actualizarPacienteTelefono" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Actualizar paciente</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para añadir historia-->
    <div class="modal" id="nuevaHistoriaModal" tabindex="-1" aria-labelledby="nuevaHistoriaModalEtiqueta"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="nuevaHistoriaModalEtiqueta">Añadir nueva historia clínica</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <!-- Formulario para añadir una nueva historia -->
                    <form id="nuevaHistoriaForm">
                        <div class="mb-3">
                            <label for="nuevaHistoriaDiagnostico" class="form-label">Diagnóstico</label>
                            <input type="text" class="form-control" id="nuevaHistoriaDiagnostico" required>
                        </div>
                        <div class="mb-3">
                            <label for="nuevaHistoriaFecha" class="form-label">Fecha de admisión</label>
                            <input type="date" class="form-control" id="nuevaHistoriaFecha" required>
                        </div>
                        <div class="mb-3">
                            <label for="nuevaHistoriaMedico" class="form-label">Médico</label>
                            <select class="form-select" id="nuevaHistoriaMedico" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="nuevaHistoriaRecetas" class="form-label">Recetas</label>
                            <select class="form-select" id="nuevaHistoriaRecetas" multiple></select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Añadir historia clínica</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

        <!-- Modal para actualizar historia-->
        <div class="modal" id="actualizarHistoriaModal" tabindex="-1" aria-labelledby="actualizarHistoriaModalEtiqueta"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="actualizarHistoriaModalEtiqueta">Actualizar historia clínica</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <!-- Formulario para actualizar una historia -->
                    <form id="actualizarHistoriaForm">
                        <div class="mb-3">
                            <label for="actualizarHistoriaId" class="form-label">Id de la historia</label>
                            <input type="text" class="form-control" id="actualizarHistoriaId" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="actualizarHistoriaDiagnostico" class="form-label">Diagnóstico</label>
                            <input type="text" class="form-control" id="actualizarHistoriaDiagnostico" required>
                        </div>
                        <div class="mb-3" hidden>
                            <label for="actualizarHistoriaFecha" class="form-label">Fecha de admisión</label>
                            <input type="date" class="form-control" id="actualizarHistoriaFecha" required>
                        </div>
                        <div class="mb-3">
                            <label for="actualizarHistoriaIdPaciente" class="form-label">Id del paciente</label>
                            <input type="text" class="form-control" id="actualizarHistoriaIdPaciente" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="actualizarHistoriaIdMedico" class="form-label">Médico</label>
                            <select class="form-select" id="actualizarHistoriaIdMedico" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="actualizarHistoriaRecetas" class="form-label">Recetas</label>
                            <select class="form-select" id="actualizarHistoriaRecetas" multiple></select>
                        </div>
                        <button type="submit" class="btn btn-primary">Actualizar historia clínica</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
